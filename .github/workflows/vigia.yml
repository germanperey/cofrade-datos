# Vigía del sitio (15-11-2026, Germán: «un auditor que todos los días revise al menos cada 6 horas si hay algún error en algún
# contenido y/o en el funcionamiento de alguna aplicación ... para repararlo automáticamente»; ese mismo día, a las 07:21, lo ajustó:
# «que el "auditor" revise, audite, repare y mejore todo cada 3 horas (en vez de cada 6 horas)»).
# Revisa el sitio como un lector (edición, gráficos, Buzón, Socios, Mercado Pago vía /salud) y los datos de GitHub; repara solo lo
# seguro (vuelve a correr bajadas y trabajos fallidos) y deja el informe en datos/salud-sitio.json. Si queda algo grave, abre un
# aviso (issue) que GitHub manda por correo; el auditor de Claude (tarea programada cada 3 h, unos 35 minutos después) lo lee y sigue.
# Si GitHub se atrasa más de media hora, la visita de un lector a la portada se lo vuelve a pedir (reloj de respaldo del sitio).
name: Vigía del sitio

on:
  workflow_dispatch:
  schedule:
    # cada 3 horas (GitHub usa hora UTC): 21:42, 00:42, 03:42, 06:42, 09:42, 12:42, 15:42 y 18:42 de Chile en horario de verano;
    # en el de invierno (abril a septiembre), una hora antes
    - cron: "42 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests==2.32.3 playwright==1.48.0 pillow==11.0.0 && python -m playwright install --with-deps chromium
      - run: python herramientas/vigia.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capturas de la portada desde la edición más nueva (una vez por edición)
        run: |
          python herramientas/capturas.py || echo "Capturas sin rehacer (quedan las anteriores)"
      - name: Guardar el informe
        run: |
          git config user.name "vigia-cofrade"; git config user.email "vigia@users.noreply.github.com"
          git add datos/salud-sitio.json sitio/capturas
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -qm "Vigía $(date -u +%FT%H:%M)"
          ok=0; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && ok=1 && break; sleep 10; done
          [ "$ok" = 1 ] || { echo "no se pudo subir el informe"; exit 1; }
