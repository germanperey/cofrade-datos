# Sonda de fuentes (diagnóstico a pedido, 14-11-2026): revisa robots.txt y prueba fuentes oficiales nuevas antes de sumarlas
# al programa de datos. No cambia nada del repositorio: deja lo leído como «artefacto» descargable de la corrida.
name: Sonda de fuentes (diagnóstico)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests==2.32.3
      - run: python herramientas/sonda.py
      - name: Dejar lo leído en la rama «sonda» (no toca main)
        run: |
          git config user.name "sonda-cofrade"; git config user.email "sonda@users.noreply.github.com"
          mv sonda /tmp/sonda && git checkout --orphan sonda && git rm -rq --cached . && git clean -fdq
          cp -r /tmp/sonda . && git add sonda && git commit -qm "Sonda de fuentes $(date -u +%F)" && git push -qf origin sonda
