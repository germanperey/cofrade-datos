# Cofrade News · datos oficiales del día (gratis, en GitHub Actions)
# Corre todos los días a las 10:20 UTC (07:20 de Santiago en horario de verano, 06:20 en invierno).
name: Datos oficiales del día

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cofrade-datos
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerías
        run: pip install --quiet requests==2.32.3 pandas==2.2.3 lxml==5.3.0
      - name: Probar el programa
        run: python pruebas.py
      - name: Bajar datos oficiales
        run: python bajar.py --salida datos
      - name: Guardar en el repositorio
        run: |
          git config user.name "cofrade-datos"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "Datos oficiales $(date -u +%Y-%m-%d)"
          git push
