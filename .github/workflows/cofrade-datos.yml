# Cofrade News · datos oficiales del día (gratis, en GitHub Actions)
# Corre tres veces cada madrugada (03:17, 05:17 y 07:17 UTC = 00:17, 02:17 y 04:17 de Santiago en verano),
# antes de la tarea de las 06:47. También se puede correr a mano: pestaña «Actions» → «Datos oficiales del día» → «Run workflow».
name: Datos oficiales del día

on:
  schedule:
    - cron: "17 3,5,7 * * *"   # 00:17, 02:17 y 04:17 de Santiago (verano): GitHub a veces atrasa horas sus relojes; con tres intentos al menos uno llega antes de las 06:47
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cofrade-datos
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerías
        run: pip install --quiet requests==2.32.3 pandas==2.2.3 lxml==5.3.0
      - name: Probar el programa
        run: python pruebas.py
      - name: Bajar datos oficiales
        env:   # 30-10-2026: cuenta GRATUITA de OpenSky (opcional). Sin estos dos secretos, OpenSky rechaza a GitHub (HTTP 403) y se sigue sin él
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python bajar.py --salida datos
      - name: Guardar en el repositorio
        run: |
          git config user.name "cofrade-datos"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "Datos oficiales $(date -u +%Y-%m-%d)"
          git push
