# Cofrade News · datos oficiales del día (gratis, en GitHub Actions)
# Corre CADA HORA de madrugada (03:23 a 09:23 UTC = 00:23 a 06:23 de Santiago en verano), antes de la tarea de las 06:47.
# 01-11-2026: el 31-10 GitHub atrasó sus horarios casi 6 horas (corrió a las 06:03 y 06:47): con 7 intentos, alguno llega a tiempo. También se puede correr a mano: pestaña «Actions» → «Datos oficiales del día» → «Run workflow».
name: Datos oficiales del día

on:
  schedule:
    - cron: "23 3-9 * * *"   # cada hora de 00:23 a 06:23 de Santiago (verano); cada corrida deja los datos más nuevos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cofrade-datos
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar librerías
        run: pip install --quiet requests==2.32.3 pandas==2.2.3 lxml==5.3.0
      - name: Probar el programa
        run: python pruebas.py
      - name: Bajar datos oficiales
        env:   # 30-10-2026: cuenta GRATUITA de OpenSky (opcional). Sin estos dos secretos, OpenSky rechaza a GitHub (HTTP 403) y se sigue sin él
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          # 01-11-2026: cuentas GRATUITAS opcionales para los mercados (sin ellas se sigue con las demás fuentes)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: python bajar.py --salida datos
      - name: Guardar en el repositorio
        run: |
          git config user.name "cofrade-datos"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "Datos oficiales $(date -u +%Y-%m-%d)"
          # 01-11-2026: si otra corrida (o un archivo subido a mano) llegó antes, se junta y se reintenta (antes fallaba con error)
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
